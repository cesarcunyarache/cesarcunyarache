<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" fill="none" role="img" aria-label="About Cesar Cunyarache">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08122b"/>
      <stop offset="1" stop-color="#050b1c"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0.82" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <path id="track" d="M50 128 H1010"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    .rule { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s .3s ease-out forwards; }
    .caret { opacity: 0; animation: caret 1s 3.6s steps(1) infinite; }
    .p { fill: #60a5fa; } .o { fill: #8fb4ee; } .c { fill: #eaf2ff; }
  </style>

  <rect width="1200" height="556" rx="26" fill="#050b1c"/>

  <!-- header -->
  <g class="in" style="animation-delay:.05s">
    <text x="50" y="42" class="mono" font-size="13" letter-spacing="4" fill="#60a5fa"><tspan fill="#eaf2ff" font-weight="700">01</tspan>  ABOUT</text>
    <text x="1150" y="42" class="mono" font-size="12" letter-spacing="4" text-anchor="end" fill="#6f9ae0">WHO I AM</text>
  </g>
  <g class="in" style="animation-delay:.15s">
    <text x="48" y="104" class="serif" font-size="56" letter-spacing="-1" fill="#f4f8ff">Hello, I'm <tspan font-style="italic" fill="url(#name)">Cesar</tspan><tspan fill="#60a5fa">.</tspan></text>
  </g>
  <line class="rule" x1="50" y1="128" x2="1150" y2="128" stroke="url(#rule)" stroke-width="1.5"/>
  <circle cx="50" cy="128" r="4" fill="#bfdbfe" opacity="0.9">
    <animateMotion dur="9s" repeatCount="indefinite" path="M0 0 H1000"/>
  </circle>

  <!-- card -->
  <g class="in" style="animation-delay:.3s">
    <rect x="12.5" y="150.5" width="1175" height="381" rx="26" fill="url(#card)" stroke="#3b82f6" stroke-opacity="0.3"/>
    <rect x="12.5" y="150.5" width="1175" height="381" rx="26" fill="url(#cardGlow)"/>
  </g>

  <!-- terminal -->
  <g class="in" style="animation-delay:.45s">
    <rect x="50.5" y="180.5" width="690" height="320" rx="14" fill="#050a18" stroke="#3b82f6" stroke-opacity="0.32"/>
    <path d="M51 218 H740" stroke="#3b82f6" stroke-opacity="0.22"/>
    <circle cx="74" cy="199" r="6" fill="#1d4ed8" fill-opacity="0.65"/>
    <circle cx="96" cy="199" r="6" fill="#1d4ed8" fill-opacity="0.4"/>
    <circle cx="118" cy="199" r="6" fill="#1d4ed8" fill-opacity="0.4"/>
    <text x="395" y="204" class="mono" font-size="12.5" letter-spacing="2.5" text-anchor="middle" fill="#8fb4ee">cesar@portfolio: ~</text>
  </g>

  <g class="mono" font-size="15.5">
    <g class="in" style="animation-delay:.9s"><text x="76" y="258"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text></g>
    <g class="in" style="animation-delay:1.3s"><text x="76" y="288"><tspan class="p">→ </tspan><tspan class="o">Cesar Cunyarache · Software Developer</tspan></text></g>
    <g class="in" style="animation-delay:1.7s"><text x="76" y="318"><tspan class="p">$ </tspan><tspan class="c">cat focus.txt</tspan></text></g>
    <g class="in" style="animation-delay:2.1s"><text x="76" y="348"><tspan class="p">→ </tspan><tspan class="o">Clean architecture · Testing · Developer experience</tspan></text></g>
    <g class="in" style="animation-delay:2.5s"><text x="76" y="378"><tspan class="p">$ </tspan><tspan class="c">cat stack.txt</tspan></text></g>
    <g class="in" style="animation-delay:2.9s"><text x="76" y="408"><tspan class="p">→ </tspan><tspan class="o">TypeScript · NestJS · Flutter · Laravel</tspan></text></g>
    <g class="in" style="animation-delay:3.2s"><text x="76" y="438"><tspan class="p">$ </tspan><tspan class="c">ls ./observability</tspan></text></g>
    <g class="in" style="animation-delay:3.5s"><text x="76" y="468"><tspan class="p">→ </tspan><tspan class="o">grafana prometheus sentry posthog opentelemetry</tspan></text></g>
    <rect class="caret" x="76" y="478" width="9" height="16" fill="#93c5fd"/>
  </g>

  <!-- side cards -->
  <g>
    <g class="in" style="animation-delay:.7s">
      <rect x="790.5" y="184.5" width="360" height="94" rx="14" fill="#07112a" stroke="#3b82f6" stroke-opacity="0.32"/>
      <rect x="790" y="184" width="3.5" height="95" rx="1.75" fill="url(#bar)"/>
      <text x="816" y="212" class="mono" font-size="11" letter-spacing="3" fill="#6f9ae0">PRIMARY LANGUAGE</text>
      <text x="816" y="246" class="serif" font-size="34" fill="#f4f8ff">TypeScript</text>
      <text x="816" y="268" class="sans" font-size="13" fill="#8da8d6">NestJS · Jest · Node.js</text>
    </g>
    <g class="in" style="animation-delay:.9s">
      <rect x="790.5" y="296.5" width="360" height="94" rx="14" fill="#07112a" stroke="#3b82f6" stroke-opacity="0.32"/>
      <rect x="790" y="296" width="3.5" height="95" rx="1.75" fill="url(#bar)"/>
      <text x="816" y="324" class="mono" font-size="11" letter-spacing="3" fill="#6f9ae0">WHERE MOBILE LIVES</text>
      <text x="816" y="358" class="serif" font-size="34" fill="#f4f8ff">Flutter</text>
      <text x="816" y="380" class="sans" font-size="13" fill="#8da8d6">Dart · cross-platform apps</text>
    </g>
    <g class="in" style="animation-delay:1.1s">
      <rect x="790.5" y="408.5" width="360" height="94" rx="14" fill="#07112a" stroke="#3b82f6" stroke-opacity="0.32"/>
      <rect x="790" y="408" width="3.5" height="95" rx="1.75" fill="url(#bar)"/>
      <text x="816" y="436" class="mono" font-size="11" letter-spacing="3" fill="#6f9ae0">DRAWN TO</text>
      <text x="816" y="470" class="serif" font-size="34" fill="#f4f8ff">Observability</text>
      <text x="816" y="492" class="sans" font-size="13" fill="#8da8d6">Grafana · Prometheus · OpenTelemetry</text>
    </g>
  </g>
</svg>
